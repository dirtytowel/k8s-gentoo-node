stage4_packages:
  - sys-kernel/gentoo-kernel
  - sys-apps/systemd
  - net-misc/openssh
  - sys-boot/grub
  - dev-vcs/git
  - sec-keys/openpgp-keys-gentoo-release
stage4_use:
  sys-apps/systemd: [resolved, networkd]
  sys-kernel/installkernel: [dracut]
stage4_services:
  - sshd.service
  - systemd-networkd.service
  - systemd-resolved.service
